unit: prototype/druid/order
name: "_{Prototype Druid Order}"
group: "_{Core Rulebook}"

inc:
  - copy: prototype-druid-order
    params:
      subclass:
      orderskill: 
      orderfeat: 
      orderspell:
      anathama1: ""
      anathama2: ""

    contents:
      - set: subclass
        value: "_{Test}"

      - set: intimidation-proficiency
        value: trained


      - at: '@druid/order'
        replace:
          - h4: "#{subclass-name} _{Order}"

      # Order Skill
      - set: "#{orderskill}-proficiency"
        value: trained

      # Order Feat
      - at: '@druid/order-feat'
        replace:
          - paste: "#{orderfeat}"
    
      # Order Spell
      - at: '@druid/order-power'
        replace:
          - section: "_{Order Spell}"
            contents:
              - paste: "#{orderspell}"

      # focus spell summary line
      - at: '@focus-spells'
        add:
          - paste: "#{orderspell}-summary"

      # Anathema
      - at: '@anathema'
        replace:
          - li: "#{anathama1}"
          - li: "#{anathama2}"
          - li: "#{orderskill}-proficiency"

      - set: medicine-proficiency
        value: trained
